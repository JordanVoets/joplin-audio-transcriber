name: Bug Report
description: Report a bug or unexpected behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: When I try to transcribe an audio file...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Attach an audio file to a note
        2. Select the audio file link
        3. Click "Transcribe Selected Audio"
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The audio should be transcribed...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: An error message appeared...
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Transcription Provider
      description: Which transcription provider are you using?
      options:
        - OpenAI Whisper
        - Google Gemini
        - Other
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: What version of the plugin are you using?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: joplin-version
    attributes:
      label: Joplin Version
      description: What version of Joplin are you using?
      placeholder: "3.5.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: If applicable, paste relevant console logs (Help > Toggle Console)
      placeholder: Paste logs here...
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: This started happening after...
